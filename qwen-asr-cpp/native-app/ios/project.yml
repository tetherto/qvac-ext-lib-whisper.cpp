name: QwenAsrDemo
options:
  bundleIdPrefix: org.qwen-asr.demo
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  xcodeVersion: "16.0"
  defaultConfig: Debug
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEVELOPMENT_TEAM: "2C5PJBREQ9"
configs:
  Debug: debug
  Release: release
targets:
  QwenAsrDemo:
    type: application
    platform: iOS
    sources:
      - path: QwenAsrDemo
        excludes:
          - "samples/**"
      - path: QwenAsrDemo/samples
        name: samples
        type: folder
        buildPhase: resources
    info:
      path: QwenAsrDemo/Info.plist
      properties:
        CFBundleDisplayName: Qwen ASR
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.qwen-asr.QwenAsrDemo
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: "2C5PJBREQ9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_OBJC_BRIDGING_HEADER: QwenAsrDemo/QwenAsrDemo-Bridging-Header.h
        OTHER_LDFLAGS: "-framework Accelerate -lc++"
        CLANG_CXX_LIBRARY: "libc++"
        CLANG_ENABLE_MODULES: YES
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    dependencies:
      - framework: ../../build-mobile/QwenAsr.xcframework
        embed: false
